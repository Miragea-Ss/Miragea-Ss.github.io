name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate agent status JSON
        run: npm run agents:validate

      - name: Run UI contract checks
        run: npm run test:canvas-contract && npm run test:media-vault-responsive

      - name: Check Web3Forms access key (warning only)
        env:
          SECRET_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          VAR_WEB3FORMS_ACCESS_KEY: ${{ vars.WEB3FORMS_ACCESS_KEY }}
        run: |
          if [ -n "$SECRET_WEB3FORMS_ACCESS_KEY" ]; then
            echo "OK: secrets.WEB3FORMS_ACCESS_KEY is set (length ${#SECRET_WEB3FORMS_ACCESS_KEY})"
          elif [ -n "$VAR_WEB3FORMS_ACCESS_KEY" ]; then
            echo "OK: vars.WEB3FORMS_ACCESS_KEY is set (length ${#VAR_WEB3FORMS_ACCESS_KEY})"
          else
            echo "::warning::WEB3FORMS_ACCESS_KEY is not set as a secret or variable. The key in src/data/contact-config.ts is used (placeholder WEB3FORMS_KEY_PENDING = forms will not deliver)."
          fi

      - name: Build
        env:
          SECRET_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          VAR_WEB3FORMS_ACCESS_KEY: ${{ vars.WEB3FORMS_ACCESS_KEY }}
        run: |
          if [ -n "$SECRET_WEB3FORMS_ACCESS_KEY" ]; then
            export PUBLIC_WEB3FORMS_ACCESS_KEY="$SECRET_WEB3FORMS_ACCESS_KEY"
            echo "Contact: using secrets.WEB3FORMS_ACCESS_KEY"
          elif [ -n "$VAR_WEB3FORMS_ACCESS_KEY" ]; then
            export PUBLIC_WEB3FORMS_ACCESS_KEY="$VAR_WEB3FORMS_ACCESS_KEY"
            echo "Contact: using vars.WEB3FORMS_ACCESS_KEY"
          fi
          npm run build

      - name: Verify built internal links
        run: npm run test:site-links

      - name: Verify contact form is wired
        run: |
          if grep -q 'https://api.web3forms.com/submit' dist/eliora/atelier/ja/contact/index.html; then
            echo "OK: Web3Forms endpoint present in built contact page"
          else
            echo "::error::Built contact page has no Web3Forms endpoint."
            exit 1
          fi
          if grep -q 'WEB3FORMS_KEY_PENDING' dist/eliora/atelier/ja/contact/index.html; then
            echo "::warning::Built contact page still has the placeholder access key (WEB3FORMS_KEY_PENDING)."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
